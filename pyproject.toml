[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enskit"
dynamic = ["version"]
description = "Building blocks for ensemble Kalman methods"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Roberts", email = "agr.roberts@gmail.com" }]
keywords = [
    "ensemble kalman inversion",
    "data assimilation",
    "bayesian inference",
    "uncertainty quantification",
    "derivative-free optimization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jax>=0.10.1",
    "numpy>=2.0",
]

[project.urls]
Homepage = "https://github.com/TARPS-group/EnsKit"
Documentation = "https://tarps-group.github.io/EnsKit/"
Repository = "https://github.com/TARPS-group/EnsKit"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "sphinx>=7.0",
    "furo>=2024.1",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "import-linter>=2.1",
    "myst-nb>=1.1",
]

# The version is `enskit.__version__`, the one place it is written.
[tool.hatch.version]
path = "enskit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["enskit"]

# The source distribution carries what building and testing the package needs:
# the tests read the documentation's pages, notebooks and figures. The
# redesign's working material and the repository's own notes stay out.
[tool.hatch.build.targets.sdist]
include = ["/enskit", "/tests", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE"]
exclude = ["/docs/redesign/document", "/docs/redesign/notebooks",
           "/docs/redesign/prototype", "/docs/redesign/stubs",
           "/docs/redesign/design.html", "/docs/_build", "/docs/_generated"]

[tool.ruff]
target-version = "py311"
line-length = 90
# The redesign's working material is a record, not package code: API stubs
# that reference undefined names, and a throwaway prototype.
# The gallery's notebooks are generated from docs/examples/src, which is linted.
extend-exclude = ["docs/redesign", "docs/examples/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
# N803/N806: mathematical code uses capitals for matrices (A, L, X) by convention.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# An example imports `enskit` for its side effect, float64, and its cells
# import where the prose introduces a name.
"docs/examples/src/*" = ["F401", "E402"]
# One full reference per line, as it is printed.
"docs/examples/references.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` tests execute the example notebooks' sources; CI runs them in a job
# of their own with `pytest -m slow`, which overrides the selection below.
addopts = "-v --tb=short -m 'not slow'"
markers = ["slow: executes every example source (several minutes)"]

# The layer rules of CLAUDE.md, checked in CI with `uv run lint-imports`. A
# layer may import only the layers listed below it; layers joined by `|` are
# independent and never import each other; a name in parentheses is a layer
# that does not exist yet. `toy` and `testing` sit on top, so no layer may
# import either.
[tool.importlinter]
root_package = "enskit"

[[tool.importlinter.contracts]]
name = "Layers import downward only"
type = "layers"
layers = [
    "enskit.toy | enskit.testing",
    "enskit.algorithms",
    "enskit.maps | enskit.kalman",
    "enskit.distribution",
    "enskit.linalg",
]
