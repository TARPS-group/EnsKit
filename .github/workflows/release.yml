name: Release

# Pushing a tag vX.Y.Z on main makes the GitHub release: it checks that the tag
# is on main and is the package's version, builds the sdist and wheel, runs the
# tests against the installed wheel, and publishes the release with the
# changelog's entry as its notes and both distributions attached. It does not
# upload to PyPI. To re-run it for a tag, delete that tag's release first.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: The tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: The tag is the package's version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' enskit/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME is not v$version, enskit.__version__"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: uv build

      # The source directory is removed, so the tests can import only the wheel.
      - name: Test the built wheel
        run: |
          uv sync --group dev --no-install-project
          uv pip install "dist/enskit-$VERSION-py3-none-any.whl"
          rm -rf enskit
          uv run --no-sync python -c "import enskit; print(enskit.__file__); \
            assert enskit.__version__ == '$VERSION'"
          uv run --no-sync pytest

      - name: The changelog's entry
        run: |
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no entry '## $VERSION'"; exit 1; }

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "EnsKit $VERSION" --notes-file notes.md --verify-tag
